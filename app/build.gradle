plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'id.tkalfalah.rapor'
    compileSdk 35
    defaultConfig {
        applicationId 'id.tkalfalah.rapor'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '0.6.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}


// Salin ikon launcher yang dikelola di root repository ke resource Android sebelum build.
tasks.register('prepareLauncherIcon') {
    def source = rootProject.file('ikon-launcher.png')
    def target = file('src/main/res/drawable-nodpi/ic_launcher.png')
    inputs.file(source)
    outputs.file(target)
    doLast {
        if (!source.isFile()) {
            throw new GradleException('File ikon-launcher.png tidak ditemukan di root repository.')
        }
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareLauncherIcon')
}
